name: Release

# Bump "version" in manifest.json and package.json, merge to main, done.
# The workflow tags the commit and publishes the zip as a GitHub Release.
# To retry a failed run, use "Run workflow" on main.

on:
  push:
    branches: [main]
    paths: [manifest.json, package.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version and look for an existing release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version manifest.json)
          PACKAGE_VERSION=$(jq -r .version package.json)

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$ ]]; then
            echo "::error::manifest.json version '$VERSION' is not MAJOR.MINOR.PATCH"
            exit 1
          fi

          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::manifest.json ($VERSION) and package.json ($PACKAGE_VERSION) versions differ"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION already exists, nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $VERSION." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and zip the extension
        id: package
        run: npm run package

      - name: Tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "$VERSION" "$ARCHIVE" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
