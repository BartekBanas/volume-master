<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Volume Master</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img class="mark" src="icons/icon48.png" width="24" height="24" alt="" aria-hidden="true" />
        <h1>Volume Master</h1>
        <div class="header-meta">
          <span id="badge" class="badge">Native</span>
          <div class="unit-switch" role="group" aria-label="Volume units" data-unit="percent">
            <span class="unit-thumb" aria-hidden="true"></span>
            <button type="button" id="unit-percent" aria-pressed="true">%</button>
            <button type="button" id="unit-db" aria-pressed="false">dB</button>
          </div>
        </div>
      </header>

      <section class="readout-row">
        <p id="readout">100<span class="unit">%</span></p>
      </section>

      <div class="slider-wrap">
        <input id="slider" type="range" min="0" max="2000" value="667" step="1" aria-label="Volume" />
        <div class="ticks" aria-hidden="true">
          <span id="tick-min">0</span>
          <span id="tick-native" class="native">100</span>
          <span id="tick-max">2000</span>
        </div>
      </div>

      <footer>
        <button id="reset" type="button">Reset to 100%</button>
        <label class="limiter">
          <input id="limiter" type="checkbox" checked />
          <span class="limiter-text">Limiter</span>
          <span class="switch" aria-hidden="true"><span class="knob"></span></span>
        </label>
      </footer>

      <p id="note" hidden>Can't control this page</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
