<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Volume Master</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img class="mark" src="icons/icon48.png" width="24" height="24" alt="" aria-hidden="true" />
        <h1>Volume Master</h1>
        <div class="header-meta">
          <span id="badge" class="badge">Native</span>
          <button
            type="button"
            id="settings-toggle"
            class="icon-button"
            aria-label="Settings"
            aria-expanded="false"
            aria-controls="settings-view"
          >
            <svg class="icon icon-gear" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41L9.25 5.35C8.66 5.59 8.12 5.92 7.63 6.29L5.24 5.33c-.22-.08-.47 0-.59.22L2.74 8.87C2.62 9.08 2.66 9.34 2.86 9.48l2.03 1.58c-.04.31-.06.63-.06.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61L19.14 12.94zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
              />
            </svg>
            <svg class="icon icon-back" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2Z" />
            </svg>
          </button>
        </div>
      </header>

      <div class="views">
        <section id="main-view" class="view">
          <section class="readout-row">
            <p id="readout-label" class="readout-label" hidden>Target Volume</p>
            <p id="readout">100<span class="unit">%</span></p>
          </section>

          <div class="slider-wrap">
            <div class="controls">
              <div class="slider-column">
                <input id="slider" type="range" min="0" max="2000" value="667" step="1" aria-label="Volume" />
                <div class="ticks" aria-hidden="true">
                  <span id="tick-min">0</span>
                  <span id="tick-native" class="native">100</span>
                  <span id="tick-max">2000</span>
                </div>
              </div>
              <div id="knob" hidden></div>
            </div>
          </div>

          <footer>
            <button id="reset" type="button">Reset to 100%</button>
            <label class="setting-row limiter">
              <input id="limiter" type="checkbox" checked />
              <span class="limiter-text">Limiter</span>
              <span class="switch" aria-hidden="true"><span class="knob"></span></span>
            </label>
          </footer>

          <p id="note" hidden>Can't control this page</p>
        </section>

        <section id="settings-view" class="view" aria-label="Settings" hidden>
          <div class="setting-row">
            <span class="setting-text">
              <span class="setting-label">Units</span>
              <span class="setting-desc">All tabs. Percent or decibels</span>
            </span>
            <div class="unit-switch" role="group" aria-label="Volume units" data-unit="percent">
              <span class="unit-thumb" aria-hidden="true"></span>
              <button type="button" id="unit-percent" aria-pressed="true">%</button>
              <button type="button" id="unit-db" aria-pressed="false">dB</button>
            </div>
          </div>

          <label class="setting-row">
            <input id="compression" type="checkbox" />
            <span class="setting-text">
              <span class="setting-label">Compression mode</span>
              <span class="setting-desc">This tab. Level audio toward a target volume</span>
            </span>
            <span class="switch" aria-hidden="true"><span class="knob"></span></span>
          </label>

          <label class="setting-row">
            <input id="granular" type="checkbox" />
            <span class="setting-text">
              <span class="setting-label">Granular mode</span>
              <span class="setting-desc">All tabs. Slider snaps to preset stops</span>
            </span>
            <span class="switch" aria-hidden="true"><span class="knob"></span></span>
          </label>
        </section>
      </div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
